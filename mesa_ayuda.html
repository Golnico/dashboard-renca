<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Ayuda · Proceso y Tecnologia</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --primary:#769e33;
  --primary-light:rgba(118,158,51,0.12);
  --primary-mid:rgba(118,158,51,0.25);
  --bg:#f5f6fa;
  --bg2:#ffffff;
  --bg3:#f0f2f5;
  --border:#e4e7ef;
  --border2:#d0d5e3;
  --text:#1a1f36;
  --text2:#6b7a99;
  --text3:#a0aec0;
  --green:#2ecc71;
  --amber:#f59e0b;
  --red:#e74c3c;
  --teal:#0ea5e9;
  --radius:12px;
  --shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

/* HEADER */
.header{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.header-left{display:flex;align-items:center;gap:12px}
.back-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;text-decoration:none;transition:all .15s;display:flex;align-items:center;gap:5px}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px}
.header h1{font-size:15px;font-weight:600;color:var(--text)}
.header-sub{font-size:11px;color:var(--text2);margin-top:1px}
.last-update{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.refresh-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .15s}
.refresh-btn:hover{border-color:var(--primary);color:var(--primary)}

/* MAIN */
.main{padding:20px 28px;max-width:1400px;margin:0 auto}

/* FILTER BAR */
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow)}
.filter-bar label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.filter-bar input[type=date]{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 10px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}
.filter-bar input[type=date]:focus{border-color:var(--primary)}
.filter-sep{color:var(--text3);font-size:13px}
.filter-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .15s}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-count{font-size:11px;color:var(--text3);margin-left:auto;font-family:'DM Mono',monospace}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-left{}
.kpi-value{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-1.5px;line-height:1}
.kpi-pct{font-size:13px;color:var(--text2);font-weight:400;margin-left:4px}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-top:5px}
.kpi-bars{display:flex;align-items:flex-end;gap:3px;height:32px}
.kpi-bar{width:6px;border-radius:3px;background:var(--primary-mid)}
.kpi-bar.active{background:var(--primary)}

/* SECTION */
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:12px;margin-top:24px}

/* GRID LAYOUTS */
.grid-3{display:grid;grid-template-columns:1fr 2fr 1fr;gap:14px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:14px}

/* STATUS BARS (horizontal) */
.status-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.status-bar-label{font-size:12px;color:var(--text2);width:70px;flex-shrink:0}
.status-bar-track{flex:1;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
.status-bar-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .5s}
.status-bar-val{font-size:12px;color:var(--text);font-weight:600;width:70px;text-align:right;flex-shrink:0}

/* LOLLIPOP (severity) */
.lollipop-wrap{display:flex;align-items:flex-end;justify-content:space-around;height:120px;padding:0 8px}
.lollipop{display:flex;flex-direction:column;align-items:center;gap:0}
.lollipop-circle{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--primary);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary)}
.lollipop-stem{width:2px;background:var(--primary);flex:1;min-height:8px}
.lollipop-label{font-size:10px;color:var(--text3);margin-top:6px;text-align:center}

/* OPEN DAYS BARS */
.opendays-wrap{display:flex;align-items:flex-end;justify-content:space-around;height:100px;gap:6px}
.od-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.od-val{font-size:11px;font-weight:600;color:var(--text)}
.od-bar{width:100%;border-radius:4px 4px 0 0;background:var(--primary);min-height:4px;transition:height .4s}
.od-label{font-size:10px;color:var(--text3);white-space:nowrap}

/* AGENT PANEL */
.agent-filter-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.agent-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .2s;font-weight:500}
.agent-btn:hover{border-color:var(--primary);color:var(--primary)}
.agent-btn.selected{background:var(--primary);border-color:var(--primary);color:#fff}
.company-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:8px}
.company-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.company-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(118,158,51,0.1)}
.company-card-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.stat-label{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.stat-dot{width:6px;height:6px;border-radius:50%}
.stat-value{font-size:16px;font-weight:700;letter-spacing:-0.5px}
.company-card-total{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:11px}
.company-card-total-label{color:var(--text3)}
.company-card-total-value{font-weight:600;color:var(--text)}
.cc-bar{height:3px;position:absolute;bottom:0;left:0;right:0;background:var(--bg3)}
.cc-bar-fill{height:100%;background:var(--primary);transition:width .4s}
.ticket-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto}
.ticket-item{background:var(--bg3);border-radius:6px;padding:7px 9px}
.ticket-item-top{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.ticket-id{font-family:'DM Mono',monospace;color:var(--primary);font-weight:600;font-size:11px;flex-shrink:0}
.ticket-sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ticket-subject{color:var(--text);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-contact{color:var(--text3);font-size:10px}
.expand-hint{font-size:10px;color:var(--text3);margin-top:6px;text-align:center}
.no-tickets{text-align:center;padding:32px;color:var(--text3);font-size:13px;grid-column:1/-1}

/* TABLE */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;background:var(--bg3);border-bottom:1px solid var(--border)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.b-open{background:rgba(118,158,51,0.12);color:#4a6b1a}
.b-pending{background:rgba(245,158,11,0.12);color:#92580a}
.b-resolved{background:rgba(46,204,113,0.12);color:#1a7a3e}
.b-closed{background:rgba(14,165,233,0.12);color:#0a5a8a}
.bar-mini{height:4px;border-radius:2px;margin-top:4px;background:var(--primary)}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:13px}
.error-box{background:rgba(231,76,60,0.06);border:1px solid rgba(231,76,60,0.2);border-radius:var(--radius);padding:16px 20px;color:var(--red);font-size:13px}

@media(max-width:1100px){.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.grid-3,.grid-2,.grid-2-1{grid-template-columns:1fr}.main{padding:14px}.header{padding:12px 16px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <a class="back-btn" href="index.html">← Inicio</a>
    <div class="logo">🎧</div>
    <div>
      <h1>Mesa de Ayuda</h1>
      <div class="header-sub">Tickets de soporte · Freshdesk</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="last-update" id="last-update"></span>
    <button class="refresh-btn" onclick="loadData()">↻ Actualizar</button>
  </div>
</header>

<main class="main">
  <div class="filter-bar">
    <label>Desde</label>
    <input type="date" id="date-from" onchange="applyFilters()">
    <span class="filter-sep">→</span>
    <label>Hasta</label>
    <input type="date" id="date-to" onchange="applyFilters()">
    <button class="filter-btn" onclick="setRange(30)">30 dias</button>
    <button class="filter-btn" onclick="setRange(90)">90 dias</button>
    <button class="filter-btn" onclick="setRange(180)">6 meses</button>
    <button class="filter-btn" onclick="setRange(365)">1 ano</button>
    <button class="filter-btn" onclick="setAll()">Todo</button>
    <span class="filter-count" id="filter-count"></span>
  </div>
  <div id="dash-content">
    <div class="loading"><div class="spinner"></div><p>Cargando datos...</p></div>
  </div>
</main>

<script>
var SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1f3IBca3MrvNThStVb46n7VF28EKIWbty36-LX9b7l8FmiCjC5TM_rKL-DS1XWkjdJrISXcGDLDZE/pub?gid=0&single=true&output=csv';
var allTickets=[];
var charts={};

function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function normStatus(s){s=(s||'').trim().toLowerCase();if(s==='open'||s==='2')return'Open';if(s==='pending'||s==='3')return'Pending';if(s==='resolved'||s==='4')return'Resolved';if(s==='closed'||s==='5')return'Closed';return s||'Unknown';}
function normPriority(p){p=(p||'').trim().toLowerCase();if(p==='low'||p==='1')return'Low';if(p==='medium'||p==='2')return'Medium';if(p==='high'||p==='3')return'High';if(p==='urgent'||p==='4')return'Urgent';return p||'Unknown';}
function getField(row,names){for(var i=0;i<names.length;i++)if(row[names[i]]!==undefined&&row[names[i]]!=='')return row[names[i]];return'';}
function parseDate(str){if(!str)return null;var m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m)return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));var d=new Date(str);return isNaN(d)?null:d;}
function fmtNum(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function pct(a,b){return b>0?Math.round(a/b*100):0;}

function loadData(){
  document.getElementById('dash-content').innerHTML='<div class="loading"><div class="spinner"></div><p>Cargando datos...</p></div>';
  fetch(SHEET_URL)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(csv){
      var res=Papa.parse(csv,{header:true,skipEmptyLines:true});
      if(!res.data||!res.data.length){document.getElementById('dash-content').innerHTML='<div class="error-box">No se encontraron datos.</div>';return;}
      allTickets=res.data.map(function(r){
        return{
          status:normStatus(getField(r,['Estado','Status'])),
          priority:normPriority(getField(r,['Prioridad','Priority'])),
          agent:(getField(r,['Agente','Agent','Assigned To'])||'Sin asignar').trim(),
          created:parseDate(getField(r,['Tiempo de creacion','Tiempo de creación','Created At'])),
          resolveH:parseFloat(getField(r,['Tiempo de resolucion (en horas)','Tiempo de resolución (en horas)','Resolution Time (in hrs)']))||null,
          firstRespH:parseFloat(getField(r,['Primer tiempo de respuesta (en horas)','First Response Time (in hrs)']))||null,
          overdue:(getField(r,['Estado de resolucion','Estado de resolución','Resolution Status'])||'').toLowerCase().indexOf('violated')>=0,
          slaStatus:getField(r,['Estado de resolucion','Estado de resolución','Resolution Status']),
          company:(getField(r,['Nombre de la empresa','Company Name'])||'Sin empresa').trim(),
          ticketId:getField(r,['ID del ticket','Ticket ID']),
          subject:getField(r,['Asunto','Subject']),
          contact:getField(r,['Nombre completo','Full Name']),
          type:(getField(r,['Tipo','Type','tipo','type'])||'Sin tipo').trim()
        };
      });
      document.getElementById('last-update').textContent='Actualizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
      setAll();
    })
    .catch(function(err){document.getElementById('dash-content').innerHTML='<div class="error-box">Error: '+err.message+'</div>';});
}

function setAll(){
  var valid=allTickets.filter(function(t){return t.created&&!isNaN(t.created);}).map(function(t){return t.created.getTime();});
  if(valid.length){document.getElementById('date-from').value=new Date(Math.min.apply(null,valid)).toISOString().slice(0,10);document.getElementById('date-to').value=new Date(Math.max.apply(null,valid)).toISOString().slice(0,10);}
  applyFilters();
}
function setRange(days){
  var to=new Date(),from=new Date();from.setDate(from.getDate()-days);
  document.getElementById('date-from').value=from.toISOString().slice(0,10);
  document.getElementById('date-to').value=to.toISOString().slice(0,10);
  applyFilters();
}
function applyFilters(){
  var from=document.getElementById('date-from').value?new Date(document.getElementById('date-from').value):null;
  var to=document.getElementById('date-to').value?new Date(document.getElementById('date-to').value+'T23:59:59'):null;
  var filtered=allTickets.filter(function(t){if(!t.created||isNaN(t.created))return true;if(from&&t.created<from)return false;if(to&&t.created>to)return false;return true;});
  document.getElementById('filter-count').textContent=filtered.length+' de '+allTickets.length+' tickets';
  renderDashboard(filtered);
}

function renderDashboard(tickets){
  var total=tickets.length;
  var open=tickets.filter(function(t){return t.status==='Open';}).length;
  var pending=tickets.filter(function(t){return t.status==='Pending';}).length;
  var resolved=tickets.filter(function(t){return t.status==='Resolved';}).length;
  var closed=tickets.filter(function(t){return t.status==='Closed';}).length;
  var overdue=tickets.filter(function(t){return t.overdue;}).length;
  var withRes=tickets.filter(function(t){return t.resolveH&&t.resolveH>0;});
  var avgRes=withRes.length?withRes.reduce(function(s,t){return s+t.resolveH;},0)/withRes.length:0;
  var withResp=tickets.filter(function(t){return t.firstRespH&&t.firstRespH>0;});
  var avgResp=withResp.length?withResp.reduce(function(s,t){return s+t.firstRespH;},0)/withResp.length:0;

  // Agent map
  var agentMap={};
  tickets.forEach(function(t){
    if(!agentMap[t.agent])agentMap[t.agent]={name:t.agent,total:0,open:0,resolved:0,resH:[],respH:[]};
    agentMap[t.agent].total++;
    if(t.status==='Open')agentMap[t.agent].open++;
    if(t.status==='Resolved'||t.status==='Closed')agentMap[t.agent].resolved++;
    if(t.resolveH&&t.resolveH>0)agentMap[t.agent].resH.push(t.resolveH);
    if(t.firstRespH&&t.firstRespH>0)agentMap[t.agent].respH.push(t.firstRespH);
  });
  var agents=Object.values(agentMap).filter(function(a){var n=a.name.toLowerCase();return n!=='sin asignar'&&n!=='no agent'&&n!=='';}).sort(function(a,b){return b.total-a.total;}).slice(0,10);
  agents.forEach(function(a){a.avgRes=a.resH.length?Math.round(a.resH.reduce(function(s,v){return s+v;},0)/a.resH.length):null;a.avgResp=a.respH.length?Math.round(a.respH.reduce(function(s,v){return s+v;},0)/a.respH.length):null;});

  // Monthly
  var monthMap={},slaMap={};
  tickets.forEach(function(t){
    if(!t.created||isNaN(t.created))return;
    var k=t.created.getFullYear()+'-'+String(t.created.getMonth()+1).padStart(2,'0');
    if(!monthMap[k])monthMap[k]={open:0,pending:0,resolved:0,closed:0,total:0};
    var s=t.status.toLowerCase();if(monthMap[k][s]!==undefined)monthMap[k][s]++;monthMap[k].total++;
    if(!slaMap[k])slaMap[k]={within:0,violated:0};
    var sl=(t.slaStatus||'').toLowerCase();if(sl.indexOf('violated')>=0)slaMap[k].violated++;else if(sl.length)slaMap[k].within++;
  });
  var monthKeys=Object.keys(monthMap).sort();
  var monthLabels=monthKeys.map(function(k){var p=k.split('-');return new Date(p[0],p[1]-1,1).toLocaleDateString('es-CL',{month:'short',year:'2-digit'});});

  // Company
  var companyTotals={};
  tickets.forEach(function(t){if(!companyTotals[t.company])companyTotals[t.company]=0;companyTotals[t.company]++;});
  var top10=Object.keys(companyTotals).sort(function(a,b){return companyTotals[b]-companyTotals[a];}).slice(0,10);
  var companyMonthMap={};
  top10.forEach(function(c){companyMonthMap[c]={};});
  tickets.forEach(function(t){
    if(!t.created||isNaN(t.created)||top10.indexOf(t.company)<0)return;
    var k=t.created.getFullYear()+'-'+String(t.created.getMonth()+1).padStart(2,'0');
    if(!companyMonthMap[t.company][k])companyMonthMap[t.company][k]={created:0,resolved:0};
    companyMonthMap[t.company][k].created++;
    if(t.status==='Resolved'||t.status==='Closed')companyMonthMap[t.company][k].resolved++;
  });

  // Priority counts
  var priorities=['Urgent','High','Medium','Low'];
  var prioCounts=priorities.map(function(p){return tickets.filter(function(t){return t.priority===p;}).length;});
  var maxPrio=Math.max.apply(null,prioCounts.concat([1]));

  // Open days buckets - usa TODOS los tickets open/pending sin filtro de fecha
  var dayBuckets=[0,0,0,0,0];
  var dayLabels=['1-5 dias','6-10 dias','11-15 dias','16-20 dias','>20 dias'];
  var now=new Date();
  allTickets.filter(function(t){return (t.status==='Open'||t.status==='Pending')&&t.created&&!isNaN(t.created);}).forEach(function(t){
    var days=Math.floor((now-t.created)/86400000);
    if(days<=5)dayBuckets[0]++;
    else if(days<=10)dayBuckets[1]++;
    else if(days<=15)dayBuckets[2]++;
    else if(days<=20)dayBuckets[3]++;
    else dayBuckets[4]++;
  });
  var maxDayBucket=Math.max.apply(null,dayBuckets.concat([1]));

  // Max status for bars
  // Tipos con tickets activos (open o pending)
  var typeMap={};
  tickets.filter(function(t){return t.status==='Open'||t.status==='Pending';}).forEach(function(t){
    var tp=t.type||'Sin tipo';
    if(!typeMap[tp])typeMap[tp]=0;
    typeMap[tp]++;
  });
  var typeEntries=Object.keys(typeMap).map(function(k){return{name:k,count:typeMap[k]};}).sort(function(a,b){return b.count-a.count;});
  var maxType=typeEntries.length?typeEntries[0].count:1;

  var maxStatus=Math.max(open,pending,resolved,closed,1);
  var maxAgent=Math.max.apply(null,agents.map(function(a){return a.total;}).concat([1]));

  // Mini sparkline bars (3 bars per KPI)
  function sparkBars(color){return '<div class="kpi-bars"><div class="kpi-bar" style="height:40%;background:'+color+'"></div><div class="kpi-bar" style="height:65%;background:'+color+'"></div><div class="kpi-bar active" style="height:100%;background:'+color+'"></div></div>';}

  document.getElementById('dash-content').innerHTML=
    // KPIs
    '<div class="kpi-grid">'+
      '<div class="kpi-card"><div class="kpi-left"><div class="kpi-value">'+fmtNum(total)+'</div><div class="kpi-label">Tickets</div></div>'+sparkBars('var(--primary)')+'</div>'+
      '<div class="kpi-card"><div class="kpi-left"><div class="kpi-value">'+fmtNum(open)+'<span class="kpi-pct">('+pct(open,total)+'%)</span></div><div class="kpi-label">Abiertos</div></div>'+sparkBars('var(--primary)')+'</div>'+
      '<div class="kpi-card"><div class="kpi-left"><div class="kpi-value">'+fmtNum(resolved)+'<span class="kpi-pct">('+pct(resolved,total)+'%)</span></div><div class="kpi-label">Resueltos</div></div>'+sparkBars('#2ecc71')+'</div>'+
      '<div class="kpi-card"><div class="kpi-left"><div class="kpi-value">'+(avgRes>0?avgRes.toFixed(1)+'h':'N/A')+'</div><div class="kpi-label">Tiempo res. prom.</div></div>'+sparkBars('var(--amber)')+'</div>'+
      '<div class="kpi-card"><div class="kpi-left"><div class="kpi-value">'+overdue+'</div><div class="kpi-label">SLA Violado</div></div>'+sparkBars('var(--red)')+'</div>'+
      '<div class="kpi-card"><div class="kpi-left"><div class="kpi-value">'+(avgResp>0?avgResp.toFixed(1)+'h':'N/A')+'</div><div class="kpi-label">1a Resp. prom.</div></div>'+sparkBars('#0ea5e9')+'</div>'+
    '</div>'+
    // Row 1: estado activo | tendencia mensual (grande)
    '<div class="grid-2-1" style="margin-bottom:14px">'+
      '<div class="card"><div class="card-title">Tendencia mensual</div><div style="position:relative;height:220px"><canvas id="chart-monthly"></canvas></div></div>'+
      '<div class="card"><div class="card-title">Por estado — activos</div>'+
        '<div style="margin-bottom:12px;padding:12px;background:var(--primary-light);border-radius:8px;display:flex;justify-content:space-between;align-items:center">'+
          '<div><div style="font-size:28px;font-weight:700;color:var(--primary);letter-spacing:-1px">'+(open+pending)+'</div><div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em">Open + Pending</div></div>'+
          '<div style="text-align:right"><div style="font-size:13px;color:var(--text2)"><span style="font-weight:600;color:var(--primary)">'+open+'</span> abiertos</div><div style="font-size:13px;color:var(--text2)"><span style="font-weight:600;color:var(--amber)">'+pending+'</span> pendientes</div></div>'+
        '</div>'+
        ['Open','Pending','Resolved','Closed'].map(function(s,i){
          var counts=[open,pending,resolved,closed];
          var colors=['var(--primary)','var(--amber)','var(--green)','var(--teal)'];
          return'<div class="status-bar-row"><div class="status-bar-label">'+s+'</div><div class="status-bar-track"><div class="status-bar-fill" style="width:'+pct(counts[i],maxStatus)+'%;background:'+colors[i]+'"></div></div><div class="status-bar-val">'+fmtNum(counts[i])+'<span style="color:var(--text3);font-size:10px;font-weight:400"> ('+pct(counts[i],total)+'%)</span></div></div>';
        }).join('')+
      '</div>'+
    '</div>'+
    // Tipos activos
    '<div class="grid-2" style="margin-bottom:14px">'+
      '<div class="card"><div class="card-title">Tickets activos por tipo (Open + Pending)</div>'+
        '<div id="type-bars"></div>'+
      '</div>'+
      '<div class="card"><div class="card-title">Tickets abiertos por antiguedad</div><div class="opendays-wrap" id="opendays-wrap"></div></div>'+
    '</div>'+

    // SLA completo ancho
    '<div class="card" style="margin-bottom:14px">'+
      '<div class="card-title">SLA por mes — Within SLA vs Violated</div>'+
      '<div style="display:flex;gap:16px;margin-bottom:10px">'+
        '<span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(118,158,51,0.7);display:inline-block"></span>Within SLA</span>'+
        '<span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(231,76,60,0.7);display:inline-block"></span>SLA Violated</span>'+
      '</div>'+
      '<div style="position:relative;height:260px"><canvas id="chart-sla"></canvas></div>'+
    '</div>'+
    // Row 3: company selector
    '<div class="card" style="margin-bottom:14px"><div class="card-title">Creados vs Resueltos por empresa</div>'+
      '<div style="margin-bottom:12px"><select id="company-select" onchange="updateCompanyChart()" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 12px;font-size:13px;font-family:DM Sans,sans-serif;outline:none;cursor:pointer;min-width:220px"></select></div>'+
      '<div id="leg-company" style="display:flex;gap:12px;margin-bottom:10px;font-size:11px;color:var(--text2)"></div>'+
      '<div style="position:relative;height:220px"><canvas id="chart-company"></canvas></div>'+
    '</div>'+
    // Panel agente
    '<div class="card" style="margin-bottom:14px"><div class="card-title">Panel de trabajo por agente</div>'+
      '<div class="agent-filter-row" id="agent-btn-row"></div>'+
      '<div class="company-cards" id="company-cards-grid"></div>'+
    '</div>'+
    // Tabla agentes
    '<p class="section-title">Resumen por agente</p>'+
    '<div class="table-wrap"><table><thead><tr><th>Agente</th><th>Total</th><th>Abiertos</th><th>Resueltos</th><th>Tiempo res.</th><th>1a resp.</th><th>Carga</th></tr></thead><tbody>'+
    agents.map(function(a){
      return'<tr><td style="font-weight:600">'+a.name+'</td><td>'+a.total+'</td><td><span class="badge b-open">'+a.open+'</span></td><td style="color:#1a7a3e;font-weight:600">'+a.resolved+'</td><td style="font-family:DM Mono,monospace;color:var(--primary)">'+(a.avgRes!==null?a.avgRes+'h':'—')+'</td><td style="font-family:DM Mono,monospace;color:#0a5a8a">'+(a.avgResp!==null?a.avgResp+'h':'—')+'</td><td style="min-width:100px"><div style="font-size:11px;color:var(--text3)">'+Math.round(a.total/maxAgent*100)+'%</div><div class="bar-mini" style="width:'+Math.round(a.total/maxAgent*100)+'%"></div></td></tr>';
    }).join('')+
    '</tbody></table></div>';

  // Lollipop removido

  // Open days - crear canvas desde JS después de que el DOM esté listo
  destroyChart('opendays');
  var _dayBuckets=dayBuckets.slice(), _dayLabels=dayLabels.slice();
  setTimeout(function(){
    var container=document.getElementById('opendays-container');
    if(!container)return;
    container.innerHTML='';
    var canvas=document.createElement('canvas');
    container.appendChild(canvas);
    charts['opendays']=new Chart(canvas,{
      type:'bar',
      data:{
        labels:_dayLabels,
        datasets:[{
          data:_dayBuckets,
          backgroundColor:'rgba(118,158,51,0.75)',
          borderRadius:6,
          borderSkipped:false
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:function(ctx){return' '+ctx.parsed.y+' tickets';}}}
        },
        scales:{
          x:{ticks:{color:'#a0aec0',font:{size:10}},grid:{display:false}},
          y:{beginAtZero:true,ticks:{color:'#a0aec0',font:{size:10},stepSize:1},grid:{color:'rgba(0,0,0,0.04)'}}
        }
      }
    });
  },100);

  // Type bars
  var typeEl=document.getElementById('type-bars');
  if(typeEl){
    if(!typeEntries.length){
      typeEl.innerHTML='<p style="color:var(--text3);font-size:12px;text-align:center;padding:20px">No hay tickets activos</p>';
    } else {
      typeEl.innerHTML=typeEntries.map(function(e){
        var pct2=Math.round(e.count/maxType*100);
        // Acortar nombre si es muy largo
        var shortName=e.name.replace('TI - ','');
        return'<div class="status-bar-row">'+
          '<div class="status-bar-label" style="width:160px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+e.name+'">'+shortName+'</div>'+
          '<div class="status-bar-track"><div class="status-bar-fill" style="width:'+pct2+'%"></div></div>'+
          '<div class="status-bar-val" style="width:40px">'+e.count+'</div>'+
        '</div>';
      }).join('');
    }
  }

  // Chart monthly trend
  destroyChart('monthly');
  charts['monthly']=new Chart(document.getElementById('chart-monthly'),{
    type:'line',
    data:{labels:monthLabels,datasets:[
      {label:'Total',data:monthKeys.map(function(k){return monthMap[k].total||0;}),borderColor:'#1a1f36',backgroundColor:'transparent',tension:0.4,borderWidth:2,borderDash:[4,3],pointRadius:2,pointBackgroundColor:'#1a1f36'},
      {label:'Open',data:monthKeys.map(function(k){return monthMap[k].open||0;}),borderColor:'#769e33',backgroundColor:'rgba(118,158,51,0.08)',fill:true,tension:0.4,borderWidth:2,pointRadius:2,pointBackgroundColor:'#769e33'},
      {label:'Resolved',data:monthKeys.map(function(k){return monthMap[k].resolved||0;}),borderColor:'#2ecc71',backgroundColor:'transparent',tension:0.4,borderWidth:2,pointRadius:2,pointBackgroundColor:'#2ecc71'},
      {label:'Closed',data:monthKeys.map(function(k){return monthMap[k].closed||0;}),borderColor:'#0ea5e9',backgroundColor:'transparent',tension:0.4,borderWidth:1.5,borderDash:[4,3],pointRadius:2,pointBackgroundColor:'#0ea5e9'},
      {label:'Pending',data:monthKeys.map(function(k){return monthMap[k].pending||0;}),borderColor:'#f59e0b',backgroundColor:'transparent',tension:0.4,borderWidth:1.5,pointRadius:2,pointBackgroundColor:'#f59e0b'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{ticks:{color:'#a0aec0',font:{size:10},autoSkip:true,maxRotation:45},grid:{display:false}},y:{beginAtZero:true,ticks:{color:'#a0aec0',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}}}}
  });

  // Chart SLA
  destroyChart('sla');
  charts['sla']=new Chart(document.getElementById('chart-sla'),{
    type:'bar',
    data:{labels:monthLabels,datasets:[
      {label:'Within SLA',data:monthKeys.map(function(k){return slaMap[k]?slaMap[k].within:0;}),backgroundColor:'rgba(118,158,51,0.7)',stack:'s',borderRadius:2,borderSkipped:false},
      {label:'Violated',data:monthKeys.map(function(k){return slaMap[k]?slaMap[k].violated:0;}),backgroundColor:'rgba(231,76,60,0.7)',stack:'s',borderRadius:2,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{stacked:true,ticks:{color:'#a0aec0',font:{size:10},autoSkip:true,maxRotation:45},grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{color:'#a0aec0',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}}}}
  });

  // Save globals
  window._dashMonthKeys=monthKeys;window._dashMonthLabels=monthLabels;
  window._dashCompanyMonthMap=companyMonthMap;window._dashTop10=top10;
  window._dashCompanyTotals=companyTotals;window._dashAgents=agents;window._dashTickets=tickets;

  // Company select
  var sel=document.getElementById('company-select');
  if(sel)sel.innerHTML=top10.map(function(c){return'<option value="'+c+'">'+c+' ('+companyTotals[c]+')</option>';}).join('');
  updateCompanyChart();
  renderAgentBtns();
}

function updateCompanyChart(){
  var sel=document.getElementById('company-select');if(!sel||!window._dashMonthKeys)return;
  var c=sel.value,mk=window._dashMonthKeys,ml=window._dashMonthLabels,map=window._dashCompanyMonthMap;
  var total=window._dashCompanyTotals[c]||0;
  var res=mk.reduce(function(s,k){return s+(map[c]&&map[c][k]?map[c][k].resolved:0);},0);
  var legEl=document.getElementById('leg-company');
  if(legEl)legEl.innerHTML='<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:rgba(118,158,51,0.7);display:inline-block"></span>Creados ('+total+')</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:rgba(46,204,113,0.7);display:inline-block"></span>Resueltos ('+res+')</span>';
  destroyChart('company');
  charts['company']=new Chart(document.getElementById('chart-company'),{
    type:'bar',
    data:{labels:ml,datasets:[
      {label:'Creados',data:mk.map(function(k){return map[c]&&map[c][k]?map[c][k].created:0;}),backgroundColor:'rgba(118,158,51,0.7)',borderRadius:4,borderSkipped:false},
      {label:'Resueltos',data:mk.map(function(k){return map[c]&&map[c][k]?map[c][k].resolved:0;}),backgroundColor:'rgba(46,204,113,0.7)',borderRadius:4,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{ticks:{color:'#a0aec0',font:{size:10},autoSkip:true,maxRotation:45},grid:{display:false}},y:{beginAtZero:true,ticks:{color:'#a0aec0',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}}}}
  });
}

function renderAgentBtns(){
  var agents=window._dashAgents||[],tickets=window._dashTickets||[];
  var active=agents.filter(function(a){return tickets.some(function(t){return t.agent===a.name&&(t.status==='Open'||t.status==='Pending');});});
  var row=document.getElementById('agent-btn-row');if(!row)return;
  if(!active.length){row.innerHTML='<span style="font-size:12px;color:var(--text3)">No hay agentes con tickets activos</span>';return;}
  row.innerHTML=active.map(function(a,i){return'<button class="agent-btn" data-idx="'+i+'">'+a.name.split(' ')[0]+'</button>';}).join('');
  var btns=row.querySelectorAll('.agent-btn');
  btns.forEach(function(btn,i){btn.setAttribute('data-agent',active[i].name);btn.addEventListener('click',function(){renderCompanyCards(active[i].name);});});
  if(btns.length)btns[0].classList.add('selected');
  if(active.length)renderCompanyCards(active[0].name);
}

function renderCompanyCards(agentName){
  document.querySelectorAll('.agent-btn').forEach(function(b){b.classList.toggle('selected',b.getAttribute('data-agent')===agentName);});
  var tickets=window._dashTickets||[],grid=document.getElementById('company-cards-grid');if(!grid)return;
  var active=tickets.filter(function(t){return t.agent===agentName&&(t.status==='Open'||t.status==='Pending');});
  if(!active.length){grid.innerHTML='<div class="no-tickets">🎉 '+agentName.split(' ')[0]+' no tiene tickets activos</div>';return;}
  var cm={};
  active.forEach(function(t){var c=t.company||'Sin empresa';if(!cm[c])cm[c]={open:0,pending:0,tickets:[]};if(t.status==='Open')cm[c].open++;if(t.status==='Pending')cm[c].pending++;cm[c].tickets.push(t);});
  var cos=Object.keys(cm).sort(function(a,b){return(cm[b].open+cm[b].pending)-(cm[a].open+cm[a].pending);});
  var maxT=Math.max.apply(null,cos.map(function(c){return cm[c].open+cm[c].pending;}));
  grid.innerHTML=cos.map(function(c){
    var o=cm[c].open,p=cm[c].pending,tot=o+p,pct2=Math.round(tot/maxT*100);
    var items=cm[c].tickets.map(function(t){
      return'<div class="ticket-item"><div class="ticket-item-top"><span class="ticket-id">#'+t.ticketId+'</span><span class="ticket-sdot" style="background:'+(t.status==='Open'?'var(--primary)':'var(--amber)')+'"></span><span class="ticket-subject" title="'+(t.subject||'')+'">'+(t.subject||'Sin asunto')+'</span></div><div class="ticket-contact">👤 '+(t.contact||'Sin contacto')+'</div></div>';
    }).join('');
    return'<div class="company-card">'+
      '<div class="company-card-name" title="'+c+'">'+c+'</div>'+
      '<div class="stat-row"><div class="stat-label"><span class="stat-dot" style="background:var(--primary)"></span>Abiertos</div><div class="stat-value" style="color:var(--primary)">'+o+'</div></div>'+
      '<div class="stat-row"><div class="stat-label"><span class="stat-dot" style="background:var(--amber)"></span>Pendientes</div><div class="stat-value" style="color:var(--amber)">'+p+'</div></div>'+
      '<div class="company-card-total"><span class="company-card-total-label">Total activo</span><span class="company-card-total-value">'+tot+'</span></div>'+
      '<div class="expand-hint">▼ ver tickets</div>'+
      '<div class="ticket-list">'+items+'</div>'+
      '<div class="cc-bar"><div class="cc-bar-fill" style="width:'+pct2+'%"></div></div>'+
    '</div>';
  }).join('');
  setTimeout(function(){
    document.querySelectorAll('#company-cards-grid .company-card').forEach(function(card){
      card.addEventListener('click',function(){
        var list=card.querySelector('.ticket-list'),hint=card.querySelector('.expand-hint');if(!list)return;
        var isOpen=list.style.display==='flex';
        list.style.display=isOpen?'none':'flex';list.style.flexDirection='column';list.style.gap='5px';
        if(hint)hint.textContent=isOpen?'▼ ver tickets':'▲ cerrar';
        card.style.borderColor=isOpen?'':'var(--primary)';
      });
    });
  },0);
}

loadData();
</script>
</body>
</html>
