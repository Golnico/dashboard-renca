<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Soporte – Renca</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0;
    --text2: #8b92a8;
    --text3: #555e78;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --teal: #22d3ee;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }
  .header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(15,17,23,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #fff;
  }
  .header h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
  .header-subtitle { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .last-update { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .refresh-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 12px;
    font-family: 'DM Sans', sans-serif; transition: all .15s;
  }
  .refresh-btn:hover { background: var(--bg2); color: var(--text); border-color: var(--accent); }

  .main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }

  /* Loading state */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--text2); font-size: 13px; }

  /* Error state */
  .error-box {
    background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2);
    border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px;
    color: #fca5a5; font-size: 13px;
  }

  /* KPI grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s;
  }
  .kpi-card:hover { border-color: var(--border2); }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--kpi-color, var(--accent));
    opacity: 0.7;
  }
  .kpi-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 600; color: var(--text); letter-spacing: -1px; line-height: 1; }
  .kpi-sub { font-size: 11px; color: var(--text2); margin-top: 6px; }
  .kpi-accent { color: var(--kpi-color, var(--accent)); }

  /* Section title */
  .section-title {
    font-size: 11px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .08em; color: var(--text3); margin-bottom: 12px; margin-top: 28px;
  }

  /* Charts grid */
  .charts-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .charts-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .chart-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .chart-sub { font-size: 11px; color: var(--text3); margin-bottom: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* Table */
  .table-wrap {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500;
    color: var(--text3); text-transform: uppercase; letter-spacing: .05em;
    background: var(--bg3); border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--bg3); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; font-family: 'DM Mono', monospace;
  }
  .badge-open    { background: rgba(79,142,247,0.15); color: #93bbfc; }
  .badge-pending { background: rgba(251,191,36,0.15); color: #fcd34d; }
  .badge-resolved{ background: rgba(52,211,153,0.15); color: #6ee7b7; }
  .badge-closed  { background: rgba(52,211,153,0.10); color: #86efac; }
  .badge-urgent  { background: rgba(248,113,113,0.15); color: #fca5a5; }
  .badge-high    { background: rgba(251,191,36,0.15); color: #fcd34d; }
  .badge-medium  { background: rgba(79,142,247,0.15); color: #93bbfc; }
  .badge-low     { background: rgba(139,146,168,0.15); color: #a1a8bc; }

  .bar-mini {
    height: 4px; border-radius: 2px; margin-top: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .4s ease;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .charts-2, .charts-3 { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .header { padding: 16px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">S</div>
    <div>
      <h1>Dashboard de Soporte</h1>
      <div class="header-subtitle">Métricas de tickets · Freshdesk</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="last-update" id="last-update"></span>
    <button class="refresh-btn" onclick="loadData()">↻ Actualizar</button>
  </div>
</header>

<main class="main" id="main">
  <div class="loading" id="loading-state">
    <div class="spinner"></div>
    <p>Cargando datos desde Google Sheets…</p>
  </div>
</main>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1f3IBca3MrvNThStVb46n7VF28EKIWbty36-LX9b7l8FmiCjC5TM_rKL-DS1XWkjdJrISXcGDLDZE/pub?gid=0&single=true&output=csv';

// Column name mapping (Freshdesk Spanish headers)
const COL = {
  id:           'ID del ticket',
  subject:      'Asunto',
  status:       'Estado',
  priority:     'Prioridad',
  source:       'Fuente',
  type:         'Tipo',
  agent:        'Agente',
  group:        'Grupo',
  created:      'Tiempo de creación',
  overdue:      'Vencidas hasta ahora',
  resolvedAt:   'Hora de cierre',
  lastUpdate:   'Última hora de la actualización',
  firstResp:    'Tiempo de respuesta inicial',
  firstRespH:   'Primer tiempo de respuesta (en horas)',
  resolveH:     'Tiempo de resolución (en horas)',
  agentInter:   'Interacciones de agente',
  clientInter:  'Interacciones de cliente',
  resolveStatus:'Estado de resolución',
  firstRespStatus:'Estado de la primera respuesta',
  tags:         'Etiquetas',
  fullName:     'Nombre completo',
  contactId:    'ID de contacto',
  company:      'Nombre de la empresa'
};

// Normalize status/priority values (English Freshdesk export)
function normStatus(s) {
  s = (s||'').trim().toLowerCase();
  if (s === 'open' || s === '2') return 'Open';
  if (s === 'pending' || s === '3') return 'Pending';
  if (s === 'resolved' || s === '4') return 'Resolved';
  if (s === 'closed' || s === '5') return 'Closed';
  return s || 'Unknown';
}
function normPriority(p) {
  p = (p||'').trim().toLowerCase();
  if (p === 'low' || p === '1') return 'Low';
  if (p === 'medium' || p === '2') return 'Medium';
  if (p === 'high' || p === '3') return 'High';
  if (p === 'urgent' || p === '4') return 'Urgent';
  return p || 'Unknown';
}
function statusBadge(s) {
  const cls = { Open:'open', Pending:'pending', Resolved:'resolved', Closed:'closed' };
  return `<span class="badge badge-${cls[s]||'open'}">${s}</span>`;
}
function priorityBadge(p) {
  const cls = { Low:'low', Medium:'medium', High:'high', Urgent:'urgent' };
  return `<span class="badge badge-${cls[p]||'medium'}">${p}</span>`;
}

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function loadData() {
  document.getElementById('main').innerHTML = `
    <div class="loading" id="loading-state">
      <div class="spinner"></div>
      <p>Cargando datos desde Google Sheets…</p>
    </div>`;
  Papa.parse(SHEET_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete(results) {
      if (!results.data || results.data.length === 0) {
        showError('No se encontraron datos en la planilla. Verifica que esté publicada correctamente.');
        return;
      }
      renderDashboard(results.data);
    },
    error(err) {
      showError('No se pudo conectar con Google Sheets. Verifica que la planilla esté publicada como CSV.');
    }
  });
}

function showError(msg) {
  document.getElementById('main').innerHTML = `<div class="error-box">⚠ ${msg}</div>`;
}

function renderDashboard(raw) {
  // Parse tickets
  const tickets = raw.map(r => ({
    id:         r[COL.id] || '',
    status:     normStatus(r[COL.status]),
    priority:   normPriority(r[COL.priority]),
    agent:      (r[COL.agent] || 'Sin asignar').trim(),
    group:      (r[COL.group] || '').trim(),
    created:    r[COL.created] ? new Date(r[COL.created]) : null,
    resolveH:   parseFloat(r[COL.resolveH]) || null,
    firstRespH: parseFloat(r[COL.firstRespH]) || null,
    overdue:    (r[COL.overdue] || '').toLowerCase() === 'yes' || (r[COL.overdue] || '').toLowerCase() === 'sí',
    firstRespStatus: (r[COL.firstRespStatus] || '').trim(),
    resolveStatus:   (r[COL.resolveStatus] || '').trim(),
    agentInter: parseInt(r[COL.agentInter]) || 0,
  }));

  const total = tickets.length;
  const open = tickets.filter(t => t.status === 'Open').length;
  const pending = tickets.filter(t => t.status === 'Pending').length;
  const resolved = tickets.filter(t => t.status === 'Resolved' || t.status === 'Closed').length;
  const overdue = tickets.filter(t => t.overdue).length;

  const withResolve = tickets.filter(t => t.resolveH && t.resolveH > 0);
  const avgResolve = withResolve.length ? (withResolve.reduce((s,t) => s + t.resolveH, 0) / withResolve.length) : 0;

  const withResp = tickets.filter(t => t.firstRespH && t.firstRespH > 0);
  const avgResp = withResp.length ? (withResp.reduce((s,t) => s + t.firstRespH, 0) / withResp.length) : 0;

  // Agent stats
  const agents = [...new Set(tickets.map(t => t.agent))].filter(a => a && a !== 'Sin asignar').slice(0, 10);
  const agentStats = agents.map(a => {
    const at = tickets.filter(t => t.agent === a);
    const cl = at.filter(t => t.resolveH && t.resolveH > 0);
    return {
      name: a,
      total: at.length,
      open: at.filter(t => t.status === 'Open').length,
      resolved: at.filter(t => t.status === 'Resolved' || t.status === 'Closed').length,
      avgResolve: cl.length ? Math.round(cl.reduce((s,t) => s + t.resolveH, 0) / cl.length) : null,
      avgResp: (() => { const r = at.filter(t => t.firstRespH > 0); return r.length ? Math.round(r.reduce((s,t) => s + t.firstRespH, 0) / r.length) : null; })()
    };
  }).sort((a,b) => b.total - a.total);

  // Weekly volume (last 12 weeks)
  const now = new Date();
  const weeks = Array.from({length: 12}, (_, i) => {
    const d = new Date(now);
    d.setDate(d.getDate() - (11 - i) * 7);
    return { label: `S${i+1}`, start: new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()), count: 0 };
  });
  tickets.forEach(t => {
    if (!t.created || isNaN(t.created)) return;
    for (let i = weeks.length - 1; i >= 0; i--) {
      if (t.created >= weeks[i].start) { weeks[i].count++; break; }
    }
  });

  // Status & priority counts
  const statuses = ['Open','Pending','Resolved','Closed'];
  const priorities = ['Urgent','High','Medium','Low'];
  const statusCounts = statuses.map(s => tickets.filter(t => t.status === s).length);
  const prioCounts = priorities.map(p => tickets.filter(t => t.priority === p).length);
  const agentCounts = agentStats.map(a => a.total);
  const agentNames = agentStats.map(a => a.name.split(' ')[0]);

  // Update last update time
  document.getElementById('last-update').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit'});

  // Build HTML
  const html = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--kpi-color:#4f8ef7">
        <div class="kpi-label">Total tickets</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-sub">en la planilla</div>
      </div>
      <div class="kpi-card" style="--kpi-color:#4f8ef7">
        <div class="kpi-label">Abiertos</div>
        <div class="kpi-value kpi-accent">${open}</div>
        <div class="kpi-sub">${total > 0 ? Math.round(open/total*100) : 0}% del total</div>
      </div>
      <div class="kpi-card" style="--kpi-color:#fbbf24">
        <div class="kpi-label">Pendientes</div>
        <div class="kpi-value" style="color:var(--amber)">${pending}</div>
        <div class="kpi-sub">en espera</div>
      </div>
      <div class="kpi-card" style="--kpi-color:#34d399">
        <div class="kpi-label">Resueltos/Cerrados</div>
        <div class="kpi-value" style="color:var(--green)">${resolved}</div>
        <div class="kpi-sub">${total > 0 ? Math.round(resolved/total*100) : 0}% del total</div>
      </div>
      <div class="kpi-card" style="--kpi-color:#f87171">
        <div class="kpi-label">Vencidos</div>
        <div class="kpi-value" style="color:var(--red)">${overdue}</div>
        <div class="kpi-sub">SLA incumplido</div>
      </div>
      <div class="kpi-card" style="--kpi-color:#22d3ee">
        <div class="kpi-label">Tiempo prom. resolución</div>
        <div class="kpi-value" style="color:var(--teal)">${avgResolve > 0 ? avgResolve.toFixed(1)+'h' : 'N/A'}</div>
        <div class="kpi-sub">promedio</div>
      </div>
      <div class="kpi-card" style="--kpi-color:#7c5cfc">
        <div class="kpi-label">1ª respuesta prom.</div>
        <div class="kpi-value" style="color:var(--accent2)">${avgResp > 0 ? avgResp.toFixed(1)+'h' : 'N/A'}</div>
        <div class="kpi-sub">tiempo respuesta</div>
      </div>
    </div>

    <p class="section-title">Distribución de tickets</p>
    <div class="charts-3">
      <div class="chart-card">
        <div class="chart-title">Por estado</div>
        <div class="chart-sub">Distribución actual</div>
        <div id="leg-status" class="legend"></div>
        <div style="position:relative;height:200px"><canvas id="chart-status" role="img" aria-label="Tickets por estado"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Por prioridad</div>
        <div class="chart-sub">Nivel de urgencia</div>
        <div id="leg-prio" class="legend"></div>
        <div style="position:relative;height:200px"><canvas id="chart-prio" role="img" aria-label="Tickets por prioridad"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Tickets por agente</div>
        <div class="chart-sub">Top agentes</div>
        <div style="position:relative;height:200px"><canvas id="chart-agent-mini" role="img" aria-label="Tickets por agente"></canvas></div>
      </div>
    </div>

    <p class="section-title">Volumen semanal</p>
    <div class="chart-card full" style="margin-bottom:14px">
      <div class="chart-title">Tickets creados por semana</div>
      <div class="chart-sub">Últimas 12 semanas</div>
      <div style="position:relative;height:180px"><canvas id="chart-vol" role="img" aria-label="Volumen semanal"></canvas></div>
    </div>

    <p class="section-title">Resumen por agente</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Agente</th>
            <th>Total</th>
            <th>Abiertos</th>
            <th>Resueltos</th>
            <th>Tiempo res. prom.</th>
            <th>1ª resp. prom.</th>
            <th>Carga</th>
          </tr>
        </thead>
        <tbody id="agent-tbody"></tbody>
      </table>
    </div>
  `;

  document.getElementById('main').innerHTML = html;

  // Render charts
  const STATUS_COLORS = ['#4f8ef7','#fbbf24','#34d399','#22d3ee'];
  const PRIO_COLORS   = ['#f87171','#fbbf24','#4f8ef7','#8b92a8'];
  const AGENT_COLORS  = ['#4f8ef7','#7c5cfc','#34d399','#fbbf24','#f87171','#22d3ee','#a78bfa','#fb923c','#4ade80','#e879f9'];

  const chartDefaults = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } }
  };

  // Status donut
  destroyChart('status');
  charts['status'] = new Chart(document.getElementById('chart-status'), {
    type: 'doughnut',
    data: { labels: statuses, datasets: [{ data: statusCounts, backgroundColor: STATUS_COLORS, borderWidth: 0, hoverOffset: 4 }] },
    options: { ...chartDefaults, cutout: '65%' }
  });
  document.getElementById('leg-status').innerHTML = statuses.map((s,i) =>
    `<span class="leg"><span class="leg-dot" style="background:${STATUS_COLORS[i]}"></span>${s} (${statusCounts[i]})</span>`
  ).join('');

  // Priority donut
  destroyChart('prio');
  charts['prio'] = new Chart(document.getElementById('chart-prio'), {
    type: 'doughnut',
    data: { labels: priorities, datasets: [{ data: prioCounts, backgroundColor: PRIO_COLORS, borderWidth: 0, hoverOffset: 4 }] },
    options: { ...chartDefaults, cutout: '65%' }
  });
  document.getElementById('leg-prio').innerHTML = priorities.map((p,i) =>
    `<span class="leg"><span class="leg-dot" style="background:${PRIO_COLORS[i]}"></span>${p} (${prioCounts[i]})</span>`
  ).join('');

  // Agent mini bar
  destroyChart('agent-mini');
  charts['agent-mini'] = new Chart(document.getElementById('chart-agent-mini'), {
    type: 'bar',
    data: {
      labels: agentNames,
      datasets: [{ data: agentCounts, backgroundColor: AGENT_COLORS.slice(0, agentNames.length), borderRadius: 4, borderSkipped: false }]
    },
    options: { ...chartDefaults, scales: { x: { ticks: { color: '#555e78', font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#555e78', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } } } }
  });

  // Weekly volume line
  destroyChart('vol');
  charts['vol'] = new Chart(document.getElementById('chart-vol'), {
    type: 'line',
    data: {
      labels: weeks.map(w => w.label),
      datasets: [{
        data: weeks.map(w => w.count),
        borderColor: '#4f8ef7', backgroundColor: 'rgba(79,142,247,0.08)',
        fill: true, tension: 0.4, pointRadius: 3, pointBackgroundColor: '#4f8ef7',
        pointBorderColor: '#0f1117', pointBorderWidth: 2
      }]
    },
    options: {
      ...chartDefaults,
      scales: {
        x: { ticks: { color: '#555e78', font: { size: 11 }, autoSkip: false, maxRotation: 0 }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { color: '#555e78', font: { size: 11 }, stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });

  // Agent table
  const maxTotal = Math.max(...agentStats.map(a => a.total), 1);
  document.getElementById('agent-tbody').innerHTML = agentStats.map(a => `
    <tr>
      <td style="font-weight:500">${a.name}</td>
      <td>${a.total}</td>
      <td>${statusBadge('Open').replace('Open', String(a.open))}</td>
      <td style="color:var(--green)">${a.resolved}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--teal)">${a.avgResolve !== null ? a.avgResolve + 'h' : '—'}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--accent2)">${a.avgResp !== null ? a.avgResp + 'h' : '—'}</td>
      <td style="min-width:80px">
        <div style="font-size:11px;color:var(--text3)">${Math.round(a.total/maxTotal*100)}%</div>
        <div class="bar-mini" style="width:${Math.round(a.total/maxTotal*100)}%"></div>
      </td>
    </tr>
  `).join('');
}

loadData();
</script>
</body>
</html>
